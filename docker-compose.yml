# ============================
# WOLLOYEWA STORE BOT - DOCKER COMPOSE CONFIGURATION
# ============================
# Version: 3.9
# Services: PostgreSQL, Redis, Celery Worker, Flower, Nginx, Prometheus, Grafana

x-common-app-env: &common-app-env
  ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env}
  DEBUG: ${DEBUG:?Set DEBUG in .env}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?Set TELEGRAM_WEBHOOK_SECRET in .env}
  ADMIN_IDS: ${ADMIN_IDS:?Set ADMIN_IDS in .env}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
  DEV_FAKE_PAYMENT: ${DEV_FAKE_PAYMENT:-False}
  DEV_POPULATE_DUMMY_DATA: ${DEV_POPULATE_DUMMY_DATA:-False}
  DEV_SKIP_MIDDLEWARES: ${DEV_SKIP_MIDDLEWARES:-False}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-True}
  WEB_APP_URL: ${WEB_APP_URL:-}
  TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
  CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY:-}
  CHAPA_WEBHOOK_SECRET: ${CHAPA_WEBHOOK_SECRET:-}
  TELEBIRR_APP_ID: ${TELEBIRR_APP_ID:-}
  TELEBIRR_APP_KEY: ${TELEBIRR_APP_KEY:-}
  TELEBIRR_SHORT_CODE: ${TELEBIRR_SHORT_CODE:-}
  CBE_BIRR_MERCHANT_ID: ${CBE_BIRR_MERCHANT_ID:-}
  CBE_BIRR_TERMINAL_ID: ${CBE_BIRR_TERMINAL_ID:-}
  CBE_BIRR_SECRET_KEY: ${CBE_BIRR_SECRET_KEY:-}

services:
  # ============================
  # PostgreSQL Database
  # ============================
  postgres:
    image: postgres:15-alpine
    container_name: wolloyewa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/backup.sh:/docker-entrypoint-initdb.d/backup.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wolloyewa_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # Redis Cache & Queue Broker
  # ============================
  redis:
    image: redis:7-alpine
    container_name: wolloyewa_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wolloyewa_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # Application API & Bot
  # ============================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: wolloyewa_app
    restart: unless-stopped
    environment:
      <<: *common-app-env
    user: "${APP_UID:-1001}:${APP_GID:-1001}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - wolloyewa_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # Celery Worker (Background Tasks)
  # ============================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: wolloyewa_celery
    restart: unless-stopped
    environment:
      <<: *common-app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wolloyewa_network
    command: celery -A infrastructure.workers.celery_app worker --loglevel=info --concurrency=4
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # Celery Beat (Scheduled Tasks)
  # ============================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: beat
    container_name: wolloyewa_beat
    restart: unless-stopped
    environment:
      <<: *common-app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wolloyewa_network
    command: celery -A infrastructure.workers.celery_app beat --loglevel=info
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # Flower (Celery Monitoring)
  # ============================
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: flower
    container_name: wolloyewa_flower
    restart: unless-stopped
    environment:
      <<: *common-app-env
      FLOWER_BASIC_AUTH: "${FLOWER_USER:?Set FLOWER_USER in .env}:${FLOWER_PASSWORD:?Set FLOWER_PASSWORD in .env}"
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
      - celery_worker
    networks:
      - wolloyewa_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # Nginx Reverse Proxy
  # ============================
  nginx:
    image: nginx:alpine
    container_name: wolloyewa_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./devops/nginx/ssl:/etc/nginx/ssl:ro
      - ./bot/web_app/static:/var/www/static:ro
      - ./media:/var/www/media:ro
    depends_on:
      - app
    networks:
      - wolloyewa_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # Prometheus (Metrics Collection)
  # ============================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: wolloyewa_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./devops/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - wolloyewa_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================
  # Grafana (Visualization)
  # ============================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: wolloyewa_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?Set GRAFANA_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./devops/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - wolloyewa_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================
# Volumes
# ============================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ============================
# Networks
# ============================
networks:
  wolloyewa_network:
    driver: bridge
    name: wolloyewa_network
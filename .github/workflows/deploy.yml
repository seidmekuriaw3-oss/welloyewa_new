name: CD - Continuous Deployment

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  DOCKER_IMAGE_NAME: wolloyewa/app
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: wolloyewa

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build and tag Docker image
        id: build-staging-image
        run: |
          COMMIT_HASH=$(echo ${{ github.sha }} | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          IMAGE_TAG="${COMMIT_HASH}-${TIMESTAMP}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          
          docker build -t ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG -t ${{ env.ECR_REPOSITORY }}:latest .
          docker tag ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker tag ${{ env.ECR_REPOSITORY }}:latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
      
      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.build-staging-image.outputs.image_tag }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
      
      - name: Update ECS service
        run: |
          aws ecs update-service --cluster wolloyewa-staging --service app --force-new-deployment
      
      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable --cluster wolloyewa-staging --services app
      
      - name: Run database migrations
        run: |
          TASK_ARN=$(aws ecs run-task --cluster wolloyewa-staging --task-definition wolloyewa-migrate --overrides '{"containerOverrides":[{"name":"migrate","command":["alembic","upgrade","head"]}]}' --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster wolloyewa-staging --tasks $TASK_ARN
      
      - name: Run smoke tests
        run: |
          curl -f https://staging-api.wolloyewa.com/health || exit 1
          curl -f https://staging.wolloyewa.com || exit 1
      
      - name: Notify deployment status
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Staging Deployment Complete!
            Image: ${{ steps.build-staging-image.outputs.image_tag }}
            Environment: Staging
            Status: Success

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    if: github.ref == 'refs/heads/main'
    outputs:
      previous_task_definition: ${{ steps.update-production.outputs.previous_task_definition }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build production image
        id: build-production-image
        run: |
          COMMIT_HASH=$(echo ${{ github.sha }} | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          IMAGE_TAG="${COMMIT_HASH}-${TIMESTAMP}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          
          docker build --target production -t ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker tag ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
      
      - name: Push to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.build-production-image.outputs.image_tag }}
      
      - name: Update ECS service
        id: update-production
        run: |
          set -euo pipefail
          cluster="wolloyewa-production"
          service="app"
          image="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.build-production-image.outputs.image_tag }}"
          previous_task_definition=$(aws ecs describe-services \
            --cluster "$cluster" \
            --services "$service" \
            --query 'services[0].taskDefinition' \
            --output text)
          aws ecs describe-task-definition \
            --task-definition "$previous_task_definition" \
            --query taskDefinition \
            --output json > task-definition.json
          if ! jq -e 'any(.containerDefinitions[]; .name == "app")' task-definition.json >/dev/null; then
            echo "Task definition has no app container" >&2
            exit 1
          fi
          jq --arg image "$image" '
            .containerDefinitions |= map(if .name == "app" then .image = $image else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' task-definition.json > new-task-definition.json
          new_task_definition=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "previous_task_definition=$previous_task_definition" >> "$GITHUB_OUTPUT"
          aws ecs update-service \
            --cluster "$cluster" \
            --service "$service" \
            --task-definition "$new_task_definition"
          aws ecs wait services-stable --cluster "$cluster" --services "$service"
      
      - name: Run database migrations (maintenance mode)
        run: |
          aws ecs run-task --cluster wolloyewa-production --task-definition wolloyewa-migrate --overrides '{"containerOverrides":[{"name":"migrate","command":["alembic","upgrade","head"]}]}'
      
      - name: Verify deployment
        run: |
          sleep 60
          curl -f https://api.wolloyewa.com/health || exit 1
          curl -f https://wolloyewa.com || exit 1
      
      - name: Create deployment tag
        run: |
          git tag "deploy-${{ steps.build-production-image.outputs.image_tag }}"
          git push origin "deploy-${{ steps.build-production-image.outputs.image_tag }}"
      
      - name: Notify deployment success
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Production Deployment Successful!
            Version: ${{ steps.build-production-image.outputs.image_tag }}
            Deployed by: ${{ github.actor }}
            Commit: ${{ github.sha }}
            Time: $(date)
      
      - name: Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-production
    if: failure() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Get previous stable version
        id: previous-version
        run: |
          previous_task_definition="${{ needs.deploy-production.outputs.previous_task_definition }}"
          if [ -z "$previous_task_definition" ]; then
            echo "Previous task definition was not captured; cannot roll back safely" >&2
            exit 1
          fi
          echo "previous_task_definition=$previous_task_definition" >> "$GITHUB_OUTPUT"
      
      - name: Rollback ECS service
        run: |
          aws ecs update-service \
            --cluster wolloyewa-production \
            --service app \
            --task-definition "${{ steps.previous-version.outputs.previous_task_definition }}"
          aws ecs wait services-stable --cluster wolloyewa-production --services app
      
      - name: Notify rollback
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔴 Production Rollback Executed!
            Previous task definition: ${{ steps.previous-version.outputs.previous_task_definition }}
            Reason: Deployment failure
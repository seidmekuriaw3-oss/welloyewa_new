{% extends "base.html" %}
{% block title %}ወሎዮ ሱቅ 🇪🇹{% endblock %}

{% block content %}

<!-- ── Promo Banners ───────────────────────────────────────────── -->
<div class="promo-scroll">
    <div class="promo-card">
        <div class="promo-text">
            <h3>እስከ 30% ቅናሽ!</h3>
            <p>ምርጥ ምርቶቸን አሁን ዳሰሳ</p>
        </div>
        <a href="/app/categories" class="promo-btn">ዳሰሳ →</a>
    </div>
    <div class="promo-card promo-gold">
        <div class="promo-text">
            <h3>1ኛ ትዕዛዝ ቅናሽ</h3>
            <p>ከETB 1,000 በላይ ነፃ ዲሊቨሪ</p>
        </div>
        <a href="/app/categories" class="promo-btn">ግዛ →</a>
    </div>
</div>

<!-- ── Categories Row ─────────────────────────────────────────── -->
<div class="section" style="padding-bottom:0">
    <div class="section-title">
        📦 ምድቦች
        <a href="/app/categories" style="margin-left:auto;font-size:13px;font-weight:600;color:var(--primary);text-decoration:none">ሁሉንም ምድቦች →</a>
    </div>
    <div class="category-grid" id="homeCatGrid">
        <div style="grid-column:1/-1;text-align:center;padding:12px;color:var(--text-muted);font-size:13px">እየጫናን…</div>
    </div>
</div>

<!-- ── Products ───────────────────────────────────────────────── -->
<div class="section">
    <div class="section-title" id="productsSectionTitle">🛒 ምርቶቸ</div>
    <div class="products-grid" id="productsGrid" style="grid-template-columns:repeat(2,1fr);gap:12px">
        <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">
            ምርቶቸ እየጫናን ነው…
        </div>
    </div>
    <div id="loadMoreWrap" style="text-align:center;margin-top:18px;display:none">
        <button id="loadMoreBtn" onclick="loadMoreProds()" class="btn-primary" style="width:auto;padding:12px 36px">
            ተጨማሪ ምርቶቸ
        </button>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
const CAT_ICONS = {
    electronics: '📱', clothing: '👕', food: '🍎', 'food & drinks': '🍎',
    books: '📚', beauty: '💄', health: '💊', home: '🏠', 'home & living': '🏠',
    sports: '⚽', toys: '🧸', automotive: '🚗', agriculture: '🌾',
};
const PAGE_SIZE = 20;
const urlParams = new URLSearchParams(window.location.search);
const initialQuery = (urlParams.get('q') || '').trim();
const rawCategoryId = urlParams.get('category');
const numericCategoryId = Number(rawCategoryId);

let allProds = [];
let filteredProds = [];
let activeCatId = rawCategoryId && Number.isSafeInteger(numericCategoryId) && numericCategoryId > 0
    ? numericCategoryId
    : null;
let currentSearch = initialQuery;
let displayedPage = 0;
let totalProducts = 0;
let hasMoreProducts = false;
let loadingMoreProducts = false;
let productRequestId = 0;
let productSearchTimer = null;

function catIcon(name) {
    const normalized = String(name || '').toLowerCase();
    const match = Object.keys(CAT_ICONS).find(key => normalized.includes(key));
    return CAT_ICONS[normalized] || (match ? CAT_ICONS[match] : '🛍️');
}

function flattenCategories(categories, depth = 0) {
    return categories.flatMap(category => [
        { ...category, depth },
        ...flattenCategories(Array.isArray(category.children) ? category.children : [], depth + 1),
    ]);
}

function syncBrowseUrl() {
    const params = new URLSearchParams(window.location.search);
    if (activeCatId === null) params.delete('category');
    else params.set('category', String(activeCatId));
    if (currentSearch) params.set('q', currentSearch);
    else params.delete('q');
    const query = params.toString();
    window.history.replaceState(
        {},
        '',
        `${window.location.pathname}${query ? `?${query}` : ''}${window.location.hash}`
    );
}

function updateProductsTitle() {
    const title = document.getElementById('productsSectionTitle');
    if (!title) return;
    if (currentSearch) title.textContent = `🔍 "${currentSearch}" የፍለጋ ውጤቶች`;
    else if (activeCatId !== null) title.textContent = '🛒 በምድብ የተመረጡ ምርቶች';
    else title.textContent = '🛒 ሁሉም ምርቶች';
}

function renderProds() {
    const grid = document.getElementById('productsGrid');
    const loadMoreWrap = document.getElementById('loadMoreWrap');
    const loadMoreButton = document.getElementById('loadMoreBtn');

    if (!filteredProds.length) {
        const message = currentSearch
            ? `ለ “${he(currentSearch)}” ምርት አልተገኘም`
            : activeCatId !== null
                ? 'በዚህ ምድብ ውስጥ ምርት አልተገኘም'
                : 'ገና ምርት አልተጨመረም';
        grid.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;padding:56px 16px;color:var(--text-muted)" role="status">
                <div style="font-size:56px;margin-bottom:12px">🔍</div>
                <p style="font-size:15px;font-weight:600;color:var(--text)">${message}</p>
                ${currentSearch ? '<p style="font-size:13px;margin-top:6px">ሌላ የፍለጋ ቃል ይሞክሩ</p>' : ''}
            </div>`;
        loadMoreWrap.style.display = 'none';
        return;
    }

    grid.innerHTML = filteredProds.map(product => {
        const imageUrl = product.images && product.images.length
            ? safeUrl(product.images[0])
            : '';
        const thumb = imageUrl
            ? `<img src="${he(imageUrl)}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">`
            : '<span style="font-size:52px" aria-hidden="true">📦</span>';
        const outOfStock = Number(product.stock_quantity) <= 0;
        const nameAm = product.name_am
            ? `<div style="font-size:11px;color:var(--text-muted);margin-bottom:2px">${he(product.name_am)}</div>`
            : '';
        const id = Number(product.id);
        const price = Number(product.price) || 0;

        return `
        <div class="product-card" data-product-card="${id}">
            <a class="product-image" href="/app/product/${id}" aria-label="${he(product.name)}"
               style="height:140px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;text-decoration:none;color:inherit">
                ${thumb}
            </a>
            <div class="product-info" style="padding:10px 10px 12px">
                ${nameAm}
                <a class="product-name" href="/app/product/${id}" style="font-size:13px;line-height:1.35;margin-bottom:6px;color:inherit;text-decoration:none">${he(product.name)}</a>
                <div class="product-footer" style="gap:6px">
                    <span class="product-price" style="font-size:14px">ETB ${price.toLocaleString()}</span>
                    ${outOfStock
                        ? '<span style="font-size:10px;color:var(--danger);font-weight:600">አልቋል</span>'
                        : `<button class="btn-add" style="padding:5px 10px;font-size:11px"
                              data-add-product data-product-id="${id}"
                              data-product-name="${he(product.name)}" data-product-price="${price}">
                              🛒 ጨምር
                           </button>`}
                </div>
            </div>
        </div>`;
    }).join('');

    loadMoreWrap.style.display = hasMoreProducts ? 'block' : 'none';
    loadMoreButton.disabled = loadingMoreProducts;
    loadMoreButton.textContent = loadingMoreProducts ? 'እየጫነ ነው…' : 'ተጨማሪ ምርቶች';
}

function addCard(id, name, price) {
    cart.add({ id, name, price });
    refreshAllBadges();
}

async function loadHomeProds(append = false) {
    if (append && (!hasMoreProducts || loadingMoreProducts)) return;

    const requestId = ++productRequestId;
    const page = append ? displayedPage + 1 : 1;
    const grid = document.getElementById('productsGrid');
    const loadMoreWrap = document.getElementById('loadMoreWrap');
    const loadMoreButton = document.getElementById('loadMoreBtn');

    if (append) {
        loadingMoreProducts = true;
        loadMoreButton.disabled = true;
        loadMoreButton.textContent = 'እየጫነ ነው…';
    } else {
        loadingMoreProducts = false;
        displayedPage = 0;
        totalProducts = 0;
        hasMoreProducts = false;
        allProds = [];
        filteredProds = [];
        loadMoreWrap.style.display = 'none';
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)" role="status">ምርቶች እየተጫኑ ነው…</div>';
    }

    const params = new URLSearchParams({ page: String(page), page_size: String(PAGE_SIZE) });
    if (activeCatId !== null) params.set('category_id', String(activeCatId));
    if (currentSearch) params.set('q', currentSearch);

    try {
        const response = await fetch(`/app/api/products?${params.toString()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (requestId !== productRequestId) return;

        const items = Array.isArray(data.items) ? data.items : [];
        allProds = append ? allProds.concat(items) : items;
        filteredProds = allProds;
        displayedPage = page;
        totalProducts = Math.max(0, Number(data.total) || 0);
        hasMoreProducts = allProds.length < totalProducts;
        renderProds();
    } catch (error) {
        if (requestId !== productRequestId) return;
        if (append) {
            showToast('ተጨማሪ ምርቶችን መጫን አልተቻለም። እንደገና ይሞክሩ።');
        } else {
            grid.innerHTML = `
                <div style="grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--text-muted)" role="alert">
                    <div style="font-size:48px;margin-bottom:12px">⚠️</div>
                    <p style="font-size:14px;font-weight:600">ምርቶችን መጫን አልተቻለም</p>
                    <button type="button" onclick="loadHomeProds()" class="btn-primary" style="margin-top:16px;width:auto;padding:10px 24px;font-size:14px">
                        እንደገና ሞክር
                    </button>
                </div>`;
        }
    } finally {
        if (requestId === productRequestId) {
            loadingMoreProducts = false;
            loadMoreButton.disabled = false;
            loadMoreButton.textContent = 'ተጨማሪ ምርቶች';
            if (append) loadMoreWrap.style.display = hasMoreProducts ? 'block' : 'none';
        }
    }
}

function loadMoreProds() {
    loadHomeProds(true);
}

function filterByCat(catId) {
    activeCatId = catId === null ? null : Number(catId);
    currentSearch = '';
    const searchInput = document.getElementById('globalSearch');
    if (searchInput) searchInput.value = '';
    clearTimeout(productSearchTimer);
    clearTimeout(_sdrop.timer);
    _sdrop.close();
    syncBrowseUrl();
    document.querySelectorAll('#homeCatGrid .category-card').forEach(card => {
        const cardId = card.dataset.categoryId === '' ? null : Number(card.dataset.categoryId);
        card.classList.toggle('active', cardId === activeCatId);
    });
    updateProductsTitle();
    loadHomeProds();
}

function onGlobalSearch(value) {
    clearTimeout(_sdrop.timer);
    _sdrop.close();
    currentSearch = value.trim();
    clearTimeout(productSearchTimer);
    productSearchTimer = setTimeout(() => {
        syncBrowseUrl();
        updateProductsTitle();
        loadHomeProds();
    }, 250);
}

async function loadHomeCats() {
    const grid = document.getElementById('homeCatGrid');
    try {
        const response = await fetch('/app/api/categories', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const categories = await response.json();
        if (!Array.isArray(categories)) throw new Error('Invalid category response');

        const flatCategories = flattenCategories(categories);
        const validIds = new Set(flatCategories.map(category => Number(category.id)));
        if (activeCatId !== null && !validIds.has(activeCatId)) {
            activeCatId = null;
            syncBrowseUrl();
        }

        const items = [{ id: null, name: '', name_am: 'ሁሉም', depth: 0 }, ...flatCategories];
        grid.innerHTML = items.map(category => {
            const isAll = category.id === null;
            const isActive = isAll ? activeCatId === null : Number(category.id) === activeCatId;
            const label = isAll ? 'ሁሉም' : `${category.depth ? '↳ ' : ''}${he(category.name_am || category.name)}`;
            const icon = isAll ? '🛍️' : catIcon(category.name);
            const id = isAll ? '' : Number(category.id);
            return `
                <div class="category-card${isActive ? ' active' : ''}"
                     data-category-id="${id}" role="button" tabindex="0"
                     onclick="filterByCat(${isAll ? 'null' : id})"
                     onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();filterByCat(${isAll ? 'null' : id})}">
                    <div class="icon" aria-hidden="true">${icon}</div>
                    <div class="label">${label}</div>
                </div>`;
        }).join('');
    } catch (error) {
        grid.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;padding:16px;color:var(--text-muted)" role="alert">
                <span>ምድቦችን መጫን አልተቻለም።</span>
                <button type="button" onclick="loadHomeCats()" class="btn-primary" style="margin-left:8px;width:auto;padding:8px 16px;font-size:12px">
                    እንደገና ሞክር
                </button>
            </div>`;
    }
}

const productsGrid = document.getElementById('productsGrid');
productsGrid.addEventListener('click', event => {
    const button = event.target.closest('[data-add-product]');
    if (button) {
        event.stopPropagation();
        addCard(
            Number(button.dataset.productId),
            button.dataset.productName,
            Number(button.dataset.productPrice)
        );
        return;
    }
    const card = event.target.closest('[data-product-card]');
    if (card && !event.target.closest('a')) {
        window.location.href = `/app/product/${Number(card.dataset.productCard)}`;
    }
});

(async function boot() {
    if (currentSearch) {
        const searchInput = document.getElementById('globalSearch');
        if (searchInput) searchInput.value = currentSearch;
    }
    await loadHomeCats();
    updateProductsTitle();
    await loadHomeProds();
    refreshAllBadges();
})();
</script>
{% endblock %}

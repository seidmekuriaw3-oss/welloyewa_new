{% extends "base.html" %}
{% block title %}የይለፍ ቃል መቀየሪያ — ወሎዮ ሱቅ{% endblock %}

{% block content %}
<main class="auth-page">
    <section class="auth-card">
        <h1>የይለፍ ቃልዎን ይቀይሩ</h1>
        <p class="auth-notice">በመለያዎ የተመዘገበውን ስልክ ቁጥር ያስገቡ። ኮዱ ወደ ተያያዘው Telegram ወይም ኢሜይል ይላካል።</p>

        <form id="recoveryRequestForm">
            <label for="recoveryPhone">ስልክ ቁጥር</label>
            <input id="recoveryPhone" name="phone_number" type="tel" inputmode="tel"
                   autocomplete="tel" maxlength="20" placeholder="0912345678" required>
            <p id="recoveryRequestMessage" class="form-error" role="status" aria-live="polite"></p>
            <button class="btn-primary" type="submit">ኮድ ላክ</button>
        </form>

        <form id="recoveryConfirmForm" hidden>
            <label for="recoveryCode">የማረጋገጫ ኮድ</label>
            <input id="recoveryCode" name="otp" type="text" inputmode="numeric"
                   autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
            <label for="recoveryPassword">አዲስ የይለፍ ቃል</label>
            <input id="recoveryPassword" name="new_password" type="password"
                   autocomplete="new-password" minlength="6" maxlength="256" required>
            <label for="recoveryPasswordConfirm">የይለፍ ቃሉን ያረጋግጡ</label>
            <input id="recoveryPasswordConfirm" name="confirm_password" type="password"
                   autocomplete="new-password" minlength="6" maxlength="256" required>
            <p id="recoveryConfirmMessage" class="form-error" role="alert" aria-live="assertive"></p>
            <button class="btn-primary" type="submit">የይለፍ ቃል ቀይር</button>
        </form>

        <p id="recoverySuccessMessage" class="auth-notice" role="status" hidden></p>
        <p class="auth-link"><a href="/app/login">ወደ መግቢያ ተመለስ</a></p>
    </section>
</main>
{% endblock %}

{% block scripts %}
<script>
(() => {
    const requestForm = document.getElementById('recoveryRequestForm');
    const confirmForm = document.getElementById('recoveryConfirmForm');
    const phoneInput = document.getElementById('recoveryPhone');
    const requestMessage = document.getElementById('recoveryRequestMessage');
    const confirmMessage = document.getElementById('recoveryConfirmMessage');
    const successMessage = document.getElementById('recoverySuccessMessage');
    let normalizedPhone = '';

    function showMessage(element, message, isError) {
        element.className = isError ? 'form-error' : 'auth-notice';
        element.textContent = message;
    }

    function normalizePhone(value) {
        let phone = value.trim().replace(/[\s\-()]/g, '');
        if (phone.startsWith('00251')) phone = `0${phone.slice(5)}`;
        else if (phone.startsWith('+251')) phone = `0${phone.slice(4)}`;
        else if (phone.startsWith('251')) phone = `0${phone.slice(3)}`;
        return phone;
    }

    async function postJson(path, payload) {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 12000);
        try {
            return await fetch(path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                signal: controller.signal,
            });
        } finally {
            window.clearTimeout(timeout);
        }
    }

    requestForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        requestMessage.textContent = '';
        normalizedPhone = normalizePhone(phoneInput.value);
        if (!/^(09|07)\d{8}$/.test(normalizedPhone)) {
            showMessage(requestMessage, 'ትክክለኛ የኢትዮጵያ ስልክ ቁጥር ያስገቡ።', true);
            return;
        }

        const submit = requestForm.querySelector('button[type="submit"]');
        submit.disabled = true;
        try {
            const response = await postJson('/api/v1/users/password-reset/request', {
                phone_number: normalizedPhone,
            });
            if (!response.ok) throw new Error('request-failed');
            showMessage(
                requestMessage,
                'ቁጥሩ ከተመዘገበ፣ የማረጋገጫ ኮድ ወደ ተያያዘው መለያ ይላካል።',
                false
            );
            confirmForm.hidden = false;
            document.getElementById('recoveryCode').focus();
        } catch (error) {
            showMessage(
                requestMessage,
                error.name === 'AbortError'
                    ? 'ጥያቄው ጊዜ ወስዷል። እባክዎ እንደገና ይሞክሩ።'
                    : 'የይለፍ ቃል መቀየሪያ ጊዜያዊ ሁኔታ አልተሳካም። እባክዎ ቆይተው ይሞክሩ።',
                true
            );
        } finally {
            submit.disabled = false;
        }
    });

    confirmForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        confirmMessage.textContent = '';
        const password = document.getElementById('recoveryPassword').value;
        const confirmation = document.getElementById('recoveryPasswordConfirm').value;
        if (password !== confirmation) {
            showMessage(confirmMessage, 'ያስገቡት የይለፍ ቃል አይዛመድም።', true);
            return;
        }

        const submit = confirmForm.querySelector('button[type="submit"]');
        submit.disabled = true;
        try {
            const response = await postJson('/api/v1/users/password-reset/confirm', {
                phone_number: normalizedPhone,
                otp: document.getElementById('recoveryCode').value,
                new_password: password,
                confirm_password: confirmation,
            });
            if (!response.ok) {
                showMessage(
                    confirmMessage,
                    response.status === 400
                        ? 'ኮዱ ልክ ያልሆነ ወይም ጊዜው ያለፈ ነው። እባክዎ አዲስ ኮድ ይጠይቁ።'
                        : 'የይለፍ ቃሉን መቀየር አልተቻለም። እባክዎ ቆይተው ይሞክሩ።',
                    true
                );
                return;
            }
            successMessage.textContent = 'የይለፍ ቃልዎ ተቀይሯል። አሁን መግባት ይችላሉ።';
            successMessage.hidden = false;
            confirmForm.hidden = true;
            requestForm.hidden = true;
        } catch (error) {
            showMessage(
                confirmMessage,
                error.name === 'AbortError'
                    ? 'ጥያቄው ጊዜ ወስዷል። እባክዎ እንደገና ይሞክሩ።'
                    : 'ከአገልጋዩ ጋር መገናኘት አልተቻለም። እንደገና ይሞክሩ።',
                true
            );
        } finally {
            submit.disabled = false;
        }
    });
})();
</script>
{% endblock %}
